<title>Cipher Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F3F0E8;
    --card-bg: #14192A;
    --card-bg-2: #1C2338;
    --control-bg: #232B44;
    --control-bg-active: #2C3654;
    --text-on-card: #EDEFF6;
    --text-on-card-muted: #8890A8;
    --border-on-card: #2E3651;
    --accent: #E7B34E;
    --accent-ink: #2A2005;
    --accent-2: #4FC3A1;
    --page-text: #1B1E2A;
    --page-text-muted: #6B7080;
    --shadow: 0 30px 60px -20px rgba(15, 18, 30, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0D14;
      --page-text: #E8EAF0;
      --page-text-muted: #8B93A7;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0B0D14;
    --page-text: #E8EAF0;
    --page-text-muted: #8B93A7;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--page-text);
    font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .page {
    width: 100%;
    max-width: 460px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--page-text-muted);
    margin: 0 0 6px 2px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 22px 2px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 28px;
    box-shadow: var(--shadow);
    color: var(--text-on-card);
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card-bg-2);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 26px;
  }

  .tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-on-card-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 4px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab[aria-selected="true"] {
    background: var(--control-bg-active);
    color: var(--text-on-card);
  }

  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-on-card-muted);
    margin: 0 0 16px;
  }

  .control {
    margin-bottom: 18px;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .control-name {
    font-size: 14px;
    color: var(--text-on-card);
    width: 96px;
    flex-shrink: 0;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--control-bg);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 3px solid var(--card-bg);
    box-shadow: 0 0 0 1px var(--accent);
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 3px solid var(--card-bg);
  }

  .count-badge {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    background: var(--control-bg);
    border-radius: 7px;
    padding: 5px 9px;
    min-width: 34px;
    text-align: center;
    flex-shrink: 0;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }

  .toggle-label {
    font-size: 14px;
    color: var(--text-on-card);
  }

  .switch {
    position: relative;
    width: 40px;
    height: 23px;
    border-radius: 999px;
    background: var(--control-bg);
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .switch[aria-checked="true"] {
    background: var(--accent);
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--text-on-card);
    transition: transform 0.15s ease;
  }

  .switch[aria-checked="true"]::after {
    transform: translateX(17px);
    background: var(--accent-ink);
  }

  .switch:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .readout-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-on-card-muted);
    margin: 26px 0 10px;
  }

  .readout {
    background: var(--card-bg-2);
    border: 1px solid var(--border-on-card);
    border-radius: 12px;
    padding: 18px 16px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px;
    letter-spacing: 0.02em;
    word-break: break-all;
    line-height: 1.5;
    min-height: 30px;
  }

  .digit { color: var(--accent-2); }
  .symbol { color: var(--accent); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  button.action {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    padding: 12px 16px;
    border: none;
    cursor: pointer;
    transition: filter 0.15s ease, background 0.15s ease;
  }

  .action.primary {
    flex: 1;
    background: var(--accent);
    color: var(--accent-ink);
  }

  .action.primary:hover { filter: brightness(1.06); }

  .action.secondary {
    background: var(--control-bg);
    color: var(--text-on-card);
  }

  .action.secondary:hover { background: var(--control-bg-active); }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="page">
  <p class="eyebrow">Password Generator</p>
  <h1>Forge a password worth trusting.</h1>

  <div class="card">
    <div class="tabs" role="tablist" aria-label="Password type">
      <button class="tab" role="tab" data-type="random" aria-selected="true">Random</button>
      <button class="tab" role="tab" data-type="memorable" aria-selected="false">Memorable</button>
      <button class="tab" role="tab" data-type="pin" aria-selected="false">PIN</button>
    </div>

    <p class="section-label">Customize your new password</p>
    <div id="controls"></div>

    <p class="readout-label">Generated password</p>
    <div class="readout" id="readout" aria-live="polite"></div>

    <div class="actions">
      <button class="action primary" id="copy-btn">Copy password</button>
      <button class="action secondary" id="refresh-btn">Refresh password</button>
    </div>
  </div>
</div>

<script>
  const LOWER = "abcdefghijklmnopqrstuvwxyz";
  const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const NUMBERS = "0123456789";
  const SYMBOLS = "!@#$%^&*()-_=+[]{}";

  const WORDS = [
    "amber","anchor","antler","autumn","basil","beacon","birch","blaze","bramble","brook",
    "canyon","cedar","cinder","clover","comet","copper","coral","crest","cricket","current",
    "dapple","dawn","delta","dune","ember","falcon","fern","fjord","flare","forge",
    "garnet","glacier","granite","harbor","hazel","heron","hollow","honey","indigo","ivory",
    "jasper","juniper","kestrel","lagoon","lantern","lark","lichen","lumen","maple","marsh",
    "meadow","mesa","mirage","moss","nectar","nimbus","nutmeg","oasis","obsidian","onyx",
    "opal","orbit","otter","paddle","pebble","petrel","pewter","pine","plume","prairie",
    "quartz","quill","rapids","raven","reef","ridge","river","rowan","saffron","sage",
    "sequoia","shale","shore","silt","slate","sorrel","sparrow","spruce","summit","swallow",
    "tarn","thicket","thistle","thorn","timber","tundra","umber","valley","vapor","velvet",
    "verdant","violet","wander","warbler","willow","zenith"
  ];

  const state = { type: "random", length: 20, numbers: true, symbols: false,
                  words: 4, capitalize: false, fullWords: true, pinLength: 6 };

  const controlsEl = document.getElementById("controls");
  const readoutEl = document.getElementById("readout");
  const copyBtn = document.getElementById("copy-btn");
  const refreshBtn = document.getElementById("refresh-btn");

  /**
   * Cryptographically secure random integer in [0, max), unbiased via
   * rejection sampling: only accept bytes below the largest multiple of
   * max that fits in a byte, redrawing otherwise.
   */
  function secureRandomInt(max) {
    const limit = 256 - (256 % max);
    let byte;
    do {
      byte = crypto.getRandomValues(new Uint8Array(1))[0];
    } while (byte >= limit);
    return byte % max;
  }

  function pick(str) {
    return str[secureRandomInt(str.length)];
  }

  function buildCharset() {
    let set = LOWER + UPPER;
    if (state.numbers) set += NUMBERS;
    if (state.symbols) set += SYMBOLS;
    return set;
  }

  function generateRandomPassword() {
    const charset = buildCharset();
    let out = "";
    for (let i = 0; i < state.length; i++) out += pick(charset);
    return out;
  }

  function generateMemorablePassword() {
    const parts = [];
    for (let i = 0; i < state.words; i++) {
      let word = WORDS[secureRandomInt(WORDS.length)];
      if (!state.fullWords) word = word.slice(0, 3);
      if (state.capitalize) word = word[0].toUpperCase() + word.slice(1);
      parts.push(word);
    }
    return parts.join("-");
  }

  function generatePin() {
    let out = "";
    for (let i = 0; i < state.pinLength; i++) out += pick(NUMBERS);
    return out;
  }

  function generate() {
    if (state.type === "random") return generateRandomPassword();
    if (state.type === "memorable") return generateMemorablePassword();
    return generatePin();
  }

  function renderReadout() {
    const value = generate();
    readoutEl.innerHTML = "";
    for (const ch of value) {
      const span = document.createElement("span");
      if (/[0-9]/.test(ch)) span.className = "digit";
      else if (/[^a-zA-Z0-9]/.test(ch)) span.className = "symbol";
      span.textContent = ch;
      readoutEl.appendChild(span);
    }
  }

  function slider(name, key, min, max) {
    const row = document.createElement("div");
    row.className = "control";
    row.innerHTML = `
      <div class="control-row">
        <span class="control-name">${name}</span>
        <input type="range" min="${min}" max="${max}" value="${state[key]}" data-key="${key}">
        <span class="count-badge">${state[key]}</span>
      </div>`;
    const input = row.querySelector("input");
    const badge = row.querySelector(".count-badge");
    input.addEventListener("input", () => {
      state[key] = Number(input.value);
      badge.textContent = state[key];
      renderReadout();
    });
    return row;
  }

  function toggle(label, key) {
    const row = document.createElement("div");
    row.className = "toggle-row";
    row.innerHTML = `
      <span class="toggle-label">${label}</span>
      <button class="switch" role="switch" aria-checked="${state[key]}" data-key="${key}"></button>`;
    const btn = row.querySelector(".switch");
    btn.addEventListener("click", () => {
      state[key] = !state[key];
      btn.setAttribute("aria-checked", state[key]);
      renderReadout();
    });
    return row;
  }

  function renderControls() {
    controlsEl.innerHTML = "";
    if (state.type === "random") {
      controlsEl.appendChild(slider("Characters", "length", 8, 64));
      controlsEl.appendChild(toggle("Numbers", "numbers"));
      controlsEl.appendChild(toggle("Symbols", "symbols"));
    } else if (state.type === "memorable") {
      controlsEl.appendChild(slider("Words", "words", 3, 8));
      controlsEl.appendChild(toggle("Capitalize first letter", "capitalize"));
      controlsEl.appendChild(toggle("Use full words", "fullWords"));
    } else {
      controlsEl.appendChild(slider("Digits", "pinLength", 4, 12));
    }
  }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", "false"));
      tab.setAttribute("aria-selected", "true");
      state.type = tab.dataset.type;
      renderControls();
      renderReadout();
    });
  });

  refreshBtn.addEventListener("click", renderReadout);

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(readoutEl.textContent);
      const original = copyBtn.textContent;
      copyBtn.textContent = "Copied!";
      setTimeout(() => { copyBtn.textContent = original; }, 1200);
    } catch (e) {
      copyBtn.textContent = "Select & copy manually";
    }
  });

  renderControls();
  renderReadout();
</script>
