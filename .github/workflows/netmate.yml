name: NetMate CI

on:
  push:
    paths:
      - "network-automation/netmate/**"
      - ".github/workflows/netmate.yml"
  pull_request:
    paths:
      - "network-automation/netmate/**"
      - ".github/workflows/netmate.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: network-automation/netmate

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: network-automation/netmate/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pyright (strict)
        run: pyright --pythonpath "$(which python)"
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --no-deps --disable-pip -r requirements.lock

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: network-automation/netmate/requirements*.txt
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: Tests (unit, GUI and SSH integration)
        run: python -m pytest -v
